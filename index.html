<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Gharafa SC — Staff Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=90">
</head>
<body>

<div id="signin-gate">
  <div class="brand-dot" style="width:36px;height:36px"></div>
  <div class="club">Al-Gharafa SC</div>
  <p class="desc">Staff access only. Sign in with an authorized Google account.</p>
  <div id="g_id_signin_container"></div>
</div>

<div id="demo-banner" class="demo-banner hidden">Demo mode — sample data, Google sign-in not configured yet</div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand"><span class="brand-dot"></span> Al-Gharafa SC</div>
    <nav class="nav" aria-label="Sections">
      <button class="nav-item" data-section="wellness" data-flyout="wellness" aria-haspopup="true" aria-expanded="false" aria-current="page">Wellness</button>
      <button class="nav-item" data-section="training" data-flyout="training" aria-haspopup="true" aria-expanded="false">Training</button>
      <button class="nav-item" data-section="plan" data-view="plan">Session Plan</button>
      <button class="nav-item" data-section="workload" data-flyout="workload" aria-haspopup="true" aria-expanded="false">Workload</button>
      <button class="nav-item" data-section="testing" data-view="testing">Testing</button>
      <button class="nav-item" data-section="roster" data-view="roster">Squad</button>
      <button class="nav-item" data-section="calendar" data-view="calendar">Calendar</button>
      <button class="nav-item" data-section="reports" data-view="reports">Downloads</button>
      <button class="nav-item" disabled title="Coming soon">Heart Rate</button>
    </nav>
    <div class="topbar-right">
      <span id="today-pill" class="today-pill"></span>
      <div id="avatar" class="avatar" title="Account">·</div>
    </div>
  </div>
  <div class="flyout" id="flyout-wellness" data-default="wellness">
    <div class="flyout-inner">
      <div class="flyout-label">Wellness</div>
      <button class="flyout-link" data-view="wellness">Overview</button>
      <button class="flyout-link" data-view="longitudinal">Longitudinal</button>
    </div>
  </div>
  <div class="flyout" id="flyout-training" data-default="sessions">
    <div class="flyout-inner">
      <div class="flyout-label">Training</div>
      <button class="flyout-link" data-view="sessions">Sessions</button>
      <button class="flyout-link" data-view="week">Week load</button>
      <button class="flyout-link" data-view="objectives">Objectives</button>
    </div>
  </div>
  <div class="flyout" id="flyout-workload" data-default="squad">
    <div class="flyout-inner">
      <div class="flyout-label">Workload &amp; injury prevention</div>
      <button class="flyout-link" data-view="squad">Squad load</button>
      <button class="flyout-link" data-view="player">Player</button>
      <button class="flyout-link" data-view="readiness">Readiness</button>
    </div>
  </div>
</header>
<div class="flyout-backdrop" id="flyout-backdrop"></div>

<main class="wrap" id="view-wellness"></main>
<main class="wrap page" id="view-longitudinal" hidden></main>
<main class="wrap page" id="view-sessions" hidden></main>
<main class="wrap page" id="view-week" hidden></main>
<main class="wrap page" id="view-objectives" hidden></main>
<main class="wrap page" id="view-squad" hidden></main>
<main class="wrap page" id="view-player" hidden></main>
<main class="wrap page" id="view-readiness" hidden></main>
<main class="wrap page" id="view-testing" hidden></main>
<main class="wrap page" id="view-calendar" hidden></main>
<main class="wrap page" id="view-reports" hidden></main>
<main class="wrap page" id="view-roster" hidden></main>
<main class="wrap page" id="view-plan" hidden></main>

<script src="js/config.js?v=90"></script>
<script src="js/rings.js?v=90"></script>
<script src="js/photo-data.js?v=90"></script>
<script src="js/wellness-ring.js?v=90"></script>
<script src="js/charts.js?v=90"></script>
<script src="js/ui.js?v=90"></script>
<script src="js/longitudinal.js?v=90"></script>
<script src="js/workload.js?v=90"></script>
<script src="js/training.js?v=90"></script>
<script src="js/session-view.js?v=90"></script>
<script src="js/testing.js?v=90"></script>
<script src="js/clubs.js?v=90"></script>
<script src="js/calendar.js?v=90"></script>
<script src="js/roster.js?v=90"></script>
<script src="js/reports.js?v=90"></script>
<script src="js/reports-staff.js?v=90"></script>
<script src="js/sp-convert.js?v=90"></script>
<script src="js/session-plan.js?v=90"></script>
<script src="js/readiness.js?v=90"></script>
<script src="js/mock-data.js?v=90"></script>
<script src="js/auth.js?v=90"></script>
<script src="js/api.js?v=90"></script>
<script src="js/wellness.js?v=90"></script>
<script src="js/app.js?v=90"></script>
</body>
</html>
